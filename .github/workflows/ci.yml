name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # CPU-only torch: the GPU wheels are ~2.7GB and CI never trains,
        # it only runs the unit tests. opencv-python-headless instead of
        # opencv-python because the CI runner has no display libraries.
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2" opencv-python-headless pillow tqdm pytest

      - name: Run tests
        run: pytest tests/ -v
